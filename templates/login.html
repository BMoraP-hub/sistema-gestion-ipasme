<!-- 
  ARCHIVO: login.html
  FUNCIÓN: Interfaz de autenticación para operadores estándar. 
           Valida credenciales de acceso para iniciar sesión en el sistema.
-->

{% extends "base.html" %}
{% block content %}
<!-- FORMULARIO DE ACCESO PARA OPERADORES NORMALES: captura usuario y contraseña para iniciar sesión. -->
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="app-card text-center p-4 p-md-5">
      <div class="mb-4">
        <i class="bi bi-person-bounding-box text-primary" style="font-size: 4rem;"></i>
        <h2 class="fw-bold mt-3">Iniciar Sesión</h2>
        <p class="text-muted">Ingresa tus credenciales para continuar</p>
      </div>
      <form method="post">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold">Usuario</label>
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-transparent"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control form-control-lg" placeholder="Tu usuario" autofocus required>
          </div>
        </div>
        <div class="mb-4 text-start">
          <label class="form-label fw-bold">Contraseña</label>
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="Tu clave" required>
          </div>
        </div>
        <button type="submit" class="btn btn-main btn-lg w-100 py-2 fw-bold shadow-sm">Acceder al Sistema</button>
      </form>
      <div class="mt-4 pt-3 border-top border-secondary-subtle">
        <a href="{{ url_for('super_login') }}" class="text-decoration-none text-muted small">
          <i class="bi bi-shield-lock me-1"></i> Acceso Administrativo (Super Usuario)
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
